{% extends 'base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 100px auto; text-align: center; border: 1px solid #000; padding: 40px; background-color: #fff;">
    <h2 style="font-weight: normal; margin-bottom: 40px;">Êtes-vous sûr de vouloir supprimer cet élément ?</h2>
    
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'my_posts' %}" style="padding: 10px 20px; border: 1px solid #000; text-decoration: none; color: #000; margin-right: 20px;">Annuler</a>
        <button type="submit" style="padding: 10px 20px; border: 1px solid #000; background-color: #fff; cursor: pointer; color: red;">Oui, supprimer</button>
    </form>
</div>
{% endblock %}
