{% extends 'base.html' %}

{% block content %}
    <h2>Créer une critique</h2>
    
    <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <p>Vous répondez au ticket de <strong>{{ ticket.user }}</strong></p>
        <h3>{{ ticket.title }}</h3>
        <p>{{ ticket.description }}</p>
        {% if ticket.image %}
            <img src="{{ ticket.image.url }}" alt="Image du ticket" style="max-width: 150px;">
        {% endif %}
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Publier</button>
    </form>
{% endblock %}
