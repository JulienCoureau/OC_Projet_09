{% extends 'base.html' %}

{% block content %}
<style>
    .signup-wrapper {
        max-width: 500px;
        margin: 50px auto;
        border: 1px solid #000;
        padding: 40px;
        background-color: #fff;
        font-family: sans-serif;
    }
    .signup-title {
        text-align: center;
        font-weight: normal;
        margin-top: 0;
        margin-bottom: 30px;
        font-size: 20px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #000;
        box-sizing: border-box;
        font-family: inherit;
    }
    .errorlist {
        color: red;
        list-style: none;
        padding: 0;
        margin: 5px 0 0 0;
        font-size: 13px;
    }
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 40px;
    }
    .btn-wireframe {
        padding: 10px 30px;
        border: 1px solid #000;
        background-color: #fff;
        color: #000;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        text-align: center;
    }
    .btn-wireframe:hover {
        background-color: #f5f5f5;
    }
</style>

<div class="signup-wrapper">
    <h2 class="signup-title">Inscrivez-vous</h2>

    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    {{ field.errors }}
                {% endif %}
            </div>
        {% endfor %}

        <div class="btn-group">
            <a href="{% url 'login' %}" class="btn-wireframe">Retourner</a>
            <button type="submit" class="btn-wireframe">S'inscrire</button>
        </div>
    </form>
</div>
{% endblock %}
