{% extends 'base.html' %}

{% block content %}
<style>
    /* Style fidèle à la maquette - Page 1 */
    .login-wrapper {
        display: flex;
        justify-content: center;
        gap: 40px;
        max-width: 900px;
        margin: 50px auto;
        font-family: sans-serif;
    }
    .box {
        flex: 1;
        border: 1px solid #000;
        padding: 40px 30px;
        text-align: center;
        background-color: #fff;
    }
    .box h2 {
        font-weight: normal;
        margin-top: 0;
        margin-bottom: 30px;
        font-size: 20px;
    }
    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #000;
        box-sizing: border-box;
        font-family: inherit;
    }
    .btn-wireframe {
        padding: 10px 30px;
        border: 1px solid #000;
        background-color: #fff;
        color: #000;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px;
    }
    .btn-wireframe:hover {
        background-color: #f5f5f5;
    }
    .error-msg {
        color: red;
        font-size: 14px;
        margin-bottom: 15px;
    }
</style>

<div class="login-wrapper">
    <div class="box">
        <h2>Inscrivez-vous maintenant</h2>
        <a href="{% url 'signup' %}" class="btn-wireframe">S'inscrire</a>
    </div>

    <div class="box">
        <h2>Connectez-vous</h2>
        
        {% if message %}
            <div class="error-msg">{{ message }}</div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Mot de passe</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn-wireframe">Se connecter</button>
        </form>
    </div>
</div>
{% endblock %}
