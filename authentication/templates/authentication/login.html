<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LITReview - Connexion</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .container { width: 300px; margin: 0 auto; border: 1px solid #ccc; padding: 20px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>LITReview</h1>
    <div class="container">
        <h2>Connectez-vous</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit">Se connecter</button>
        </form>

        <p>Pas encore de compte ? <a href="#">Inscrivez-vous maintenant</a></p>
    </div>
</body>
</html>
